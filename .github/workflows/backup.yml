name: Nightly backup

# ── The schedule is OFF, deliberately. Re-enable it as part of ticket 017. ──
#
# It ran nightly from the day this workflow landed and failed every single time, because
# none of its seven secrets were ever set. That is the script behaving correctly — it
# refuses and names what is missing rather than uploading an empty archive — but a job
# that fails every night is a job you learn to ignore, which is the exact habit the
# dead-man's-switch exists to break. Leaving it on was training us to disregard the one
# alarm that matters.
#
# Nothing is being protected in the meantime: the Google Sheet is still the system of
# record and still maintained. That stops being true at ticket 024, which imports the
# sheet's history and makes this database the only copy of balance history that cannot
# be reconstructed from any bank. Neon's instant restore is **6 hours** on the free
# plan, which is not a recovery story for data like that.
#
# So: 017's secrets and a proven restore drill go in, then this schedule comes back, and
# only then does 024 run. `workflow_dispatch` stays so the job can be run by hand at any
# point — including to verify 017 before the cron is trusted again.
#
# When re-enabling, restore exactly this:
#     schedule:
#       - cron: "0 3 * * *"
# 03:00 UTC. GitHub delays scheduled runs under load, which is fine for a backup and is
# exactly why the dead-man's-switch has a grace period rather than a deadline.
on:
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner's bundled client must match the server's major version, or
      # pg_dump refuses with a version mismatch rather than producing a bad archive.
      - name: Install PostgreSQL 18 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen

      - name: Back up
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_HEALTHCHECK_URL: ${{ secrets.BACKUP_HEALTHCHECK_URL }}
        run: uv run python scripts/backup.py
