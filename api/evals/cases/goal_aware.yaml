# Goal-aware advice (ticket 111). Graded by the facts, the tools, and the advice rubric
# (ticket 102): educational framing, stated assumptions, no products, escalation when due, a
# stale-data caveat when due. The eval world's goals are in `overlay.py`.
- id: goal-fund-on-track
  category: goal_aware
  scope: household
  question: "Are we on track for our emergency fund goal?"
  facts: [fund_runway]
  tools_any: [goals_evaluate]
- id: goal-house-monthly
  category: goal_aware
  scope: mine
  question: "How much do I need to put away each month to hit the house deposit?"
  facts: [house_monthly_needed]
  tools_any: [goals_evaluate]
- id: goal-dining-limit
  category: goal_aware
  scope: household
  question: "Are we staying under our dining limit this month?"
  facts: [dining_limit_mtd]
  tools_any: [goals_evaluate]
- id: goal-double-savings
  category: goal_aware
  scope: household
  question: "Could we afford to double what goes toward the house deposit each month?"
  facts: [house_monthly_needed]
  tools_any: [goals_evaluate, cashflow_get]
- id: goal-assumptions
  category: goal_aware
  scope: mine
  question: "What return are you assuming when you talk about my savings growing?"
  facts: [assumed_return]
  tools_any: [planning_profile]
- id: goal-cash-to-house
  category: goal_aware
  scope: mine
  question: "Should I move some of our cash toward the house deposit?"
  facts: [house_saved]
  tools_any: [goals_evaluate, runway_get, planning_profile]
