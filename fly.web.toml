# Next.js service — the only publicly addressable app in this project.
#
# Cloudflare sits in front of it (DNS, TLS, HSTS, Access). Everything the browser
# touches arrives here; requests for the API are proxied server-side over the private
# network. See docs/ARCHITECTURE.md#request-path.

app = "pfa-web"
primary_region = "iad"

[build]
  # See fly.api.toml on the two roots. Deploy with `make deploy-web`.
  dockerfile = "web/Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  # Private network address of the API. Never a public hostname, and never exposed
  # to the browser — see the NEXT_PUBLIC_API_URL guard in CI.
  INTERNAL_API_URL = "http://pfa-api.internal:8000"
  # Cloudflare Access (ticket 036). Both must be set for the origin to enforce the
  # Access JWT: an audience with no issuer accepts a token from any Access tenant,
  # and an issuer with no audience accepts one minted for a different application.
  # CF_ACCESS_AUD is the Application Audience tag from the Access dashboard.
  # The default. Override it with `fly secrets set` rather than editing and
  # redeploying — renaming the team in Cloudflare changes which host serves the
  # signing keys, and the old one starts returning 404 immediately. Everyone gets a
  # bare 403 until this matches, so it wants to be a one-command fix.
  #
  # Cloudflare assigns the name and you can change it; it is NOT derived from your
  # domain. It appears in every Access redirect URL.
  CF_ACCESS_TEAM_DOMAIN = "allofmymoney.cloudflareaccess.com"

[http_service]
  internal_port = 3000
  force_https = true
  # One household's traffic. The machine sleeps when idle and the Fly proxy wakes it
  # on the next request, so idle cost is near zero.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.health]
  type = "http"
  port = 3000
  # Not "/", which redirects an unauthenticated request to /login. Fly's HTTP check
  # wants a 2xx and reads the 307 as a failing machine — it did, and the deploy timed
  # out waiting for health on a machine that was serving correctly.
  path = "/healthz"
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
