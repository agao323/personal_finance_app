name: CI

# Every branch, not just main. Wave 2 runs three lanes in parallel, and a lane needs
# to find out it broke the contract before the merge rather than after.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI supplies Postgres as a service container, so the Makefile must not try to
  # start one with docker compose.
  CI: "true"
  TEST_DATABASE_URL: postgresql+psycopg://pfa:pfa_local_dev@localhost:5432/pfa_test

jobs:
  build:
    name: lint, test, contract, guards
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pfa
          POSTGRES_PASSWORD: pfa_local_dev
          POSTGRES_DB: pfa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pfa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `package_json_file`, not a pinned `version`. This repo has no root
      # package.json, so the action's default lookup finds nothing and fails — which
      # it did, in the e2e job below. Pointing at web/package.json takes the version
      # from its `packageManager` field, so there is one source rather than a number
      # duplicated into the workflow that can drift from the lockfile.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install API dependencies
        working-directory: api
        run: uv sync --frozen

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # ── correctness ────────────────────────────────────────────────────────
      - name: Lint and typecheck
        run: make lint

      - name: Test
        run: make test

      # ── the contract ───────────────────────────────────────────────────────
      # Regenerates api-types.ts from the Pydantic models and fails if it differs
      # from what was committed. This is what stops a response-model change from
      # reaching Wave 2's lanes without the frontend types following it.
      - name: Contract drift
        run: make types-check

      # ── architectural guards ───────────────────────────────────────────────
      # Guards are tested first: one that never fires looks exactly like one that
      # is broken.
      - name: Guard self-tests
        run: ./scripts/test_guards.sh

      - name: No float in a money column
        run: ./scripts/check_no_float.sh

      - name: No public API URL in the browser bundle
        run: ./scripts/check_no_public_api_url.sh

      - name: API declares no public Fly service
        run: ./scripts/check_fly_api_private.sh

      # ── secrets ────────────────────────────────────────────────────────────
      # --redact so a finding never prints the secret into a build log, which would
      # turn a near-miss into an actual disclosure.
      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-banner --redact --verbose

      # ── coverage ───────────────────────────────────────────────────────────
      # Reported, never gated. A percentage gate is satisfied by tests that execute
      # code without asserting anything, which is worse than no gate at all.
      - name: Coverage report
        if: always()
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          (cd api && uv run coverage report 2>/dev/null || echo "no api coverage data") \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: end-to-end smoke
    runs-on: ubuntu-latest
    # A separate job because it needs the whole compose stack rather than a Postgres
    # service container, and because a browser download should not slow the lint and
    # unit run that most pushes actually care about.
    needs: build
    # Without this the job inherits GitHub's six-hour default. `playwright install
    # --with-deps` hung for two and a half hours on an apt lock before anyone noticed,
    # and a hung job looks exactly like a slow one until you go looking.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # `-f docker-compose.yml` opts out of the override, so this runs the
      # **deploy-shaped** images rather than `next dev` behind a bind mount — the same
      # choice `make smoke` makes, for the same reason. End-to-end tests should
      # exercise what actually deploys.
      #
      # It is also what fixed this job. Under the dev stack it died on
      # `Cannot find module '../lightningcss.linux-x64-musl.node'` while compiling CSS
      # on demand. The dev image loads that module fine on amd64 — I checked — so the
      # cause was something about the bind mount and the host's own node_modules in
      # the runner, and the production image simply has no bind mount to get wrong.
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml up -d --build --wait postgres api web

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # No `--with-deps`. That runs apt-get, which blocks on the lock the runner's
      # own unattended-upgrades holds at boot — indefinitely, with no output. The
      # ubuntu-latest image already carries Chromium's shared libraries, and if that
      # ever stops being true this fails in seconds with a missing-library error
      # rather than hanging.
      - name: Install the browser
        timeout-minutes: 5
        working-directory: web
        run: pnpm exec playwright install chromium

      # Seeded deliberately: these assert against real figures, and a half-empty
      # database fails them for a reason that is not a bug. The seed also clears
      # registered passkeys, so the run can register a fresh one through the real
      # ceremony with a virtual authenticator.
      # Explicit, because the deploy-shaped stack has no migration step by design:
      # on Fly that is the release command, and compose has no equivalent. The dev
      # override runs it inside the API's command, which is why this only surfaced
      # once e2e moved off the dev stack.
      - name: Migrate
        run: |
          docker compose -f docker-compose.yml exec -T \
            -e ALEMBIC_DATABASE_URL=postgresql+psycopg://pfa:pfa_local_dev@postgres:5432/pfa \
            api alembic upgrade head

      - name: Seed synthetic data
        run: |
          docker compose -f docker-compose.yml exec -T \
            -e DATABASE_URL=postgresql+psycopg://pfa:pfa_local_dev@postgres:5432/pfa \
            api python scripts/seed_synthetic.py

      - name: Playwright
        working-directory: web
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=100
